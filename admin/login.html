<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | BCKP</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"></head>
<body class="admin-body"><main class="login-wrap"><section class="login-card"><img src="../assets/logo.png" alt="BCKP"><span class="section-kicker">BCKP ADMINISTRATION</span><h1>Admin Login</h1><p>यह केवल डेमो लॉगिन स्क्रीन है। वास्तविक सुरक्षित लॉगिन के लिए सर्वर-साइड authentication जोड़ना आवश्यक है।</p><form id="adminLoginForm"><label for="adminEmail">ईमेल</label><input id="adminEmail" type="email" placeholder="admin@example.org" required><label for="adminPassword">पासवर्ड</label><input id="adminPassword" type="password" placeholder="अपना पासवर्ड" required><button class="btn" type="submit">लॉगिन करें</button><p id="loginMessage" class="form-message" aria-live="polite"></p></form><a class="text-link" href="../index.html">← मुख्य वेबसाइट पर जाएं</a></section></main><script src="../js/admin.js"></script></body></html>
