<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shubham Digital Studio | Photography & Videography</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo">Shubham <span>Digital Studio</span></div>
        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="container">
        <h1 class="section-title">Our Photography & Videography Showcase</h1>
        <p class="section-subtitle">Hover over any project image to read details</p>

        <!-- Category Filters -->
        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">All Work</button>
            <button class="filter-btn" data-filter="wedding">Weddings</button>
            <button class="filter-btn" data-filter="prewedding">Pre-Weddings</button>
            <button class="filter-btn" data-filter="cinematic">Cinematic Shoot</button>
            <button class="filter-btn" data-filter="commercial">Commercial</button>
        </div>

        <!-- Dynamic JSON Loaded Gallery Grid -->
        <div class="gallery-grid" id="galleryContainer">
            <!-- JavaScript data yahan automatically generate karega -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Shubham Digital Studio. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
